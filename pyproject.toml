[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stealth-http-client"
version = "0.1.0"
description = "Browser-grade HTTP client for scraping: TLS impersonation, proxy rotation, retries and token refresh"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anto John" }]
dependencies = ["curl_cffi>=0.7", "lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "requests>=2.31"]

[tool.setuptools]
packages = ["stealth_http"]

[tool.pytest.ini_options]
testpaths = ["tests"]
